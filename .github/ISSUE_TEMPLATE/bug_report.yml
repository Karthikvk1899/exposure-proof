name: Bug report
description: Report an incorrect calculation, validation gap, or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Never attach confidential or production portfolio data. Use a minimal synthetic example.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Exposure Proof version
    validations:
      required: true

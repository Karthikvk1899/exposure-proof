name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Prove the example book reconciles
        run: exposure-proof compare examples/baseline.csv examples/current.csv --out artifacts
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: exposure-proof-evidence
          path: artifacts/

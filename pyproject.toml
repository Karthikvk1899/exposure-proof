[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exposure-proof"
version = "0.1.0"
description = "Deterministic expected-loss change attribution and audit evidence for credit portfolios"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Karthik Beesa" }]
keywords = ["credit-risk", "portfolio-analytics", "expected-loss", "data-quality", "reconciliation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
exposure-proof = "exposure_proof.cli:main"

[project.urls]
Repository = "https://github.com/Karthikvk1899/exposure-proof"
Issues = "https://github.com/Karthikvk1899/exposure-proof/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/exposure_proof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/exposure_proof/report.py" = ["E501"]
